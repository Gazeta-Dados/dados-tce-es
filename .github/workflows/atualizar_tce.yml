name: Robô TCE-ES (JSON + Prints 2026)

on:
  schedule:
    - cron: '0 9 5 * *'

  workflow_dispatch:
    inputs:
      modo_execucao:
        description: 'Qual escopo você quer coletar?'
        required: true
        default: 'historico_completo'
        type: choice
        options:
          - teste_rapido
          - historico_completo
          - mensal
      bloco:
        description: 'Qual bloco de municípios rodar (se histórico completo)?'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
          - '7'
          - '8'
          - 'todos'
      gerar_prints:
        description: 'Gerar prints de 2026 para a revista impressa?'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  coletar_json:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Baixar repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar Playwright e Chromium
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: 4. Executar o Robô Coletor (JSON)
        env:
          MODO_EXECUCAO: ${{ github.event_name == 'schedule' && 'mensal' || inputs.modo_execucao }}
          BLOCO: ${{ github.event_name == 'schedule' && 'todos' || inputs.bloco }}
          GERAR_PRINTS: ${{ github.event_name == 'schedule' && 'false' || inputs.gerar_prints }}
        run: python coletor_tce.py

      - name: 5. Pacote de Prints de 2026 (Para Revista Impressa)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.gerar_prints == true }}
        uses: actions/upload-artifact@v4
        with:
          name: prints-tce-es-2026-bloco-${{ inputs.bloco }}
          path: prints_edicao_impressa/
          retention-days: 90

      - name: 6. Salvar JSONs atualizados no repositório
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "Robô TCE-ES"
          git pull --rebase origin ${{ github.ref_name }} || true
          git add dados/
          git diff --staged --quiet || git commit -m "📊 Atualização JSON TCE-ES (Bloco ${{ inputs.bloco }}) ($(date +'%Y-%m-%d'))"
          git push
